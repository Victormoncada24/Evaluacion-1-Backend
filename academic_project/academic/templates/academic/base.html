<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Académico{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        .card:hover {
            transform: scale(1.03);
            transition: 0.3s;
        }
        footer {
            background-color: #212529;
            color: #adb5bd;
            text-align: center;
            padding: 20px 10px;
            margin-top: auto;
        }
        footer a {
            color: #f8f9fa;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Sistema Académico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/courses/">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/students/">Estudiantes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/teachers/">Docentes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/studentcourses/">Inscripciones</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <div class="container mt-5 pt-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Sistema Académico</p>
        <p>
            <a href="/">Inicio</a> | 
            <a href="/courses/">Cursos</a> | 
            <a href="/students/">Estudiantes</a> | 
            <a href="/teachers/">Docentes</a>
        </p>
        <small>Desarrollado por Victor Aukan Moncada Tropa</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
