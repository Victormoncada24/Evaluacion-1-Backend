{% extends "academic/base.html" %}
{% block title %}Listado de Estudiantes{% endblock %}

{% block content %}
<div class="hero mb-4">
    <h1>Listado de Estudiantes</h1>
    <p>Consulta los estudiantes registrados en el sistema.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title">Estudiantes registrados</h5>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                </tr>
            </thead>
            <tbody id="students-table">
                <!-- Filas dinámicas -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Consumir el endpoint /api/students/
    fetch("/api/students/")
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById("students-table");
            tableBody.innerHTML = "";

            data.forEach(student => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.first_name}</td>
                    <td>${student.last_name}</td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Error al cargar estudiantes:", error);
        });
</script>
{% endblock %}
