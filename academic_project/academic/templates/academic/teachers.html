{% extends "academic/base.html" %}
{% block title %}Listado de Docentes{% endblock %}

{% block content %}
<div class="hero mb-4">
    <h1>Listado de Docentes</h1>
    <p>Consulta los profesores registrados en el sistema académico.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title">Docentes registrados</h5>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                </tr>
            </thead>
            <tbody id="teachers-table">
                <!-- Filas dinámicas -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Consumir el endpoint /api/teachers/
    fetch("/api/teachers/")
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById("teachers-table");
            tableBody.innerHTML = "";

            data.forEach(teacher => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${teacher.id}</td>
                    <td>${teacher.first_name}</td>
                    <td>${teacher.last_name}</td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Error al cargar docentes:", error);
        });
</script>
{% endblock %}
