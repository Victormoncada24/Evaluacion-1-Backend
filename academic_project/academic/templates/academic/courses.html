{% extends "academic/base.html" %}
{% block title %}Listado de Cursos{% endblock %}

{% block content %}
<div class="hero mb-4">
    <h1>Listado de Cursos</h1>
    <p>Consulta los cursos disponibles y sus docentes asignados.</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title">Cursos registrados</h5>
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Profesor</th>
                </tr>
            </thead>
            <tbody id="courses-table">
                <!-- Aquí se insertarán las filas dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Consumir el endpoint /api/courses/
    fetch("/api/courses/")
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById("courses-table");
            tableBody.innerHTML = ""; // limpiar antes de insertar

            data.forEach(course => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${course.id}</td>
                    <td>${course.name}</td>
                    <td>${course.teacher ? course.teacher.first_name + " " + course.teacher.last_name : "Sin asignar"}</td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error("Error al cargar cursos:", error);
        });
</script>
{% endblock %}
